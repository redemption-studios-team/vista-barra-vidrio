name: foto
on:
  workflow_dispatch:
permissions: {}
jobs:
  foto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Playwright con el Chrome del runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -m pip install -q --user playwright==1.48.0
          mkdir out
          cat > f.py <<'PY'
          from playwright.sync_api import sync_playwright
          U = "https://redemption-studios-team.github.io/vista-barra-vidrio/"
          log = []
          with sync_playwright() as p:
              b = p.chromium.launch(channel="chrome")
              for w, h in ((1440, 900), (390, 844)):
                  pg = b.new_page(viewport={"width": w, "height": h})
                  pg.on("console", lambda m: log.append("%s %s" % (m.type, m.text)))
                  pg.on("pageerror", lambda e: log.append("PAGEERROR %s" % e))
                  pg.on("requestfailed", lambda r: log.append("FAILED %s" % r.url))
                  pg.on("response", lambda r: r.status >= 400 and log.append("HTTP %s %s" % (r.status, r.url)))
                  pg.goto(U, wait_until="networkidle")
                  pg.wait_for_timeout(2500)
                  info = pg.evaluate("""() => { const h=document.querySelector('header'); const g=document.querySelector('[data-glass]');
                    return {mirrorOn: !!document.querySelector('[data-mirror-on]'), filter: !!document.querySelector('#rs-glass feDisplacementMap'),
                      under: h && (h.dataset.under||h.getAttribute('data-tone')||''), clone: document.querySelector('[data-mirror-scroll]')?.childElementCount,
                      glassBg: g && getComputedStyle(g).backgroundColor, tones: [...document.querySelectorAll('[data-tone]')].map(e=>e.dataset.tone).join(','),
                      height: document.documentElement.scrollHeight} }""")
                  log.append("INFO %d %s" % (w, info))
                  H = info["height"]
                  tops = pg.evaluate("() => [...document.querySelectorAll('main > [data-tone]')].map(e => [e.dataset.tone, Math.round(e.getBoundingClientRect().top + scrollY)])")
                  log.append("TOPS %d %s" % (w, tops))
                  ys = [("top", 0)]
                  lt = [t for t in tops if t[0] == "light"]
                  if lt:
                      y0 = lt[0][1]
                      ys += [("pre", y0 - 90), ("edge", y0 - 30), ("in", y0 + 40), ("mid", y0 + 300)]
                  ys += [("p45", int(H*0.45)), ("p65", int(H*0.65))]
                  for name, y in ys:
                      pg.evaluate("y => window.scrollTo(0, y)", max(0, y))
                      pg.wait_for_timeout(1500)
                      dbg = pg.evaluate("""() => { const h=document.querySelector('header'); const m=document.querySelector('[data-mirror]'); const s=document.querySelector('[data-mirror-scroll]'); const g=document.querySelector('[data-glass]');
                        const cs=s&&getComputedStyle(s); const pgc=s&&s.firstElementChild;
                        return {scrollY: Math.round(scrollY), under: h.dataset.under, mirrorOn: h.hasAttribute('data-mirror-on'), refract: m&&m.classList.contains('rs-mirror--refract'),
                          tf: cs&&cs.transform, range: m&&m.style.getPropertyValue('--rs-scroll-range'), mx: m&&m.style.getPropertyValue('--rs-mirror-x'), anim: cs&&cs.animationName,
                          pageH: pgc&&pgc.style.height, kids: pgc&&[...pgc.children].map(c=>c.tagName+':'+c.style.top+':'+c.childElementCount).join('|'),
                          bar: (()=>{const r=g.getBoundingClientRect();return [Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)]})(),
                          cloneBg: pgc&&getComputedStyle(pgc).backgroundColor} }""")
                      log.append("DBG %d %s %s" % (w, name, dbg))
                      pg.screenshot(path="out/w%d-%s.png" % (w, name), clip={"x":0,"y":0,"width":w,"height":260 if w>500 else 200})
                  pg.close()
              b.close()
          open("out/log.txt","w").write("\n".join(log))
          PY
          python3 f.py
          git init -q r && cd r && cp ../out/* . 
          git config user.name "foto [bot]"; git config user.email "redemptionstudios.team@gmail.com"
          git checkout -q --orphan fotos && git add -A && git commit -q -m fotos
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fotos
